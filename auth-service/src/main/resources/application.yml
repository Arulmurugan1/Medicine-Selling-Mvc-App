server:
  port: 3002

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:medicine_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:3000/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:Medicine$SecretKey2024!VeryLongAndSecure}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info
