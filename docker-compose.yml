services:
  # ── Infrastructure ────────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: medicine-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medicine_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [med-net]

  redis:
    image: redis:7-alpine
    container_name: medicine-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [med-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: medicine-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks: [med-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medicine-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [med-net]

  # ── Application Services ─────────────────────────────────────────────────────

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: medicine-eureka
    ports:
      - "3000:3000"
    networks: [med-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: medicine-gateway
    ports:
      - "3001:3001"
    environment:
      EUREKA_HOST: eureka-server
      JWT_SECRET: "Medicine$$SecretKey2024!VeryLongAndSecure"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [med-net]

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: medicine-auth
    ports:
      - "3002:3002"
    environment:
      DB_HOST: mysql
      DB_NAME: medicine_db
      DB_USER: root
      DB_PASS: root
      EUREKA_HOST: eureka-server
      JWT_SECRET: "Medicine$$SecretKey2024!VeryLongAndSecure"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [med-net]

  medicine-service:
    build:
      context: .
      dockerfile: medicine-service/Dockerfile
    container_name: medicine-catalog
    ports:
      - "3003:3003"
    environment:
      DB_HOST: mysql
      DB_NAME: medicine_db
      DB_USER: root
      DB_PASS: root
      EUREKA_HOST: eureka-server
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [med-net]

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: medicine-order
    ports:
      - "3004:3004"
    environment:
      DB_HOST: mysql
      DB_NAME: medicine_db
      DB_USER: root
      DB_PASS: root
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [med-net]

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: medicine-notify
    ports:
      - "3005:3005"
    environment:
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [med-net]

  mvc-frontend:
    build:
      context: .
      dockerfile: mvc-frontend/Dockerfile
    container_name: medicine-frontend
    ports:
      - "3006:3006"
    environment:
      GATEWAY_HOST: api-gateway
    depends_on:
      - api-gateway
    networks: [med-net]

volumes:
  mysql_data:

networks:
  med-net:
    driver: bridge
